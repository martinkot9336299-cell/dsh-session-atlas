# dsh-session-atlas extends the Web profile only: it reuses the existing DSH
# server rather than running a second application process.
- insert:
    - id: session-atlas
      name: dsh-session-atlas
      config:
        # A profile can override this path in its own cordis.patch.yml.
        dataFile: !!js dshHomePath('session-atlas/workspaces.json')
        autoProjection: true
        projectionWorkspaceTitle: DSH 任务
        # Context Graph layer: graph-events / graph-snapshot default to the
        # dataFile directory; graphLayer: false disables the layer entirely.
        graphLayer: true
        # Extra authorities the Host check accepts (host or host:port);
        # localhost and 127.0.0.1 are always allowed.
        trustedHosts: []
